# LiaraPilot deterministic configuration.
# Rule (AGENTS.md): never invent prices, limits or API behavior.
# VERIFIED facts carry source URL + checked date. Everything else stays UNVERIFIED.

limits:
  max_upload_mb: 25
  max_files: 4000            # max entries in an uploaded zip
  max_total_extract_mb: 120  # uncompressed size cap
  fix_attempts_max: 3        # agent self-fix loop cap (enforced in code)

llm:
  max_tokens_per_run: 60000  # approximate per-run budget, enforced in code (T11)
  request_timeout_s: 30

monitor:
  interval_s: 30       # poll period after a successful deploy (env MONITOR_INTERVAL_S)
  history_n: 30        # short in-RAM history per session (env MONITOR_HISTORY_N)
  alert_after: 2       # consecutive unhealthy samples before an alert (env MONITOR_ALERT_AFTER)
  max_lifetime_samples: 600  # hard stop for long-running sessions

deploy:
  timeout_s: 600
  verify_timeout_s: 10
  verify_path: "/"
  http_timeout_s: 30          # per-request timeout for the PaaS API
  poll_interval_s: 5          # app-status polling while a deploy builds
  max_retries: 3              # our policy for 429/5xx/timeout (NOT documented API behavior)
  platform_values:            # VERIFIED: config fact liara_json_platform_values
    [node, next, laravel, php, python, django, flask, dotnet, react, angular, vue, static, docker]
  source_zip_exclude:         # never travel inside the uploaded artifact (.env = secrets)
    [node_modules, .next, .git, __pycache__, .turbo, .cache, coverage, .vercel,
     .env, .DS_Store, "*.pyc", "*.pyo", "*.log", "*.sqlite", "*.db"]

security:
  # SDKs known/expected to depend on their original vendor environment.
  vendor_sdk_packages:
    - z-ai-web-dev-sdk
  secret_key_patterns:
    - password
    - passwd
    - secret
    - token
    - api_key
    - apikey
    - admin_password
  # Values that look like placeholders and are NOT flagged as hardcoded secrets.
  placeholder_value_prefixes: ["changeme", "change-me", "your-", "example", "xxx", "todo", "insert-", "<", "${", "rep"]
  secret_min_value_len: 6

demo:
  # DEMO_MODE=1 (env) forces FakeLLM + MockDeployer regardless of other settings.
  mock_failures: [bad_port, missing_env_var]   # canned MockDeployer failure sequence
  mock_port: 8080
  mock_env_var: DATABASE_URL

verified_facts:
  - id: billing_endpoint_real
    fact: >-
      GET /v1/billing (documented outside paas.yaml) returns 200 with
      {user:{balance,accountType,minCreditAmount,isManualMinCredit}}; live
      account shows balance 0 — this is why app creation returns 402
    status: VERIFIED
    source: "real HTTP call 200, 2026-10-22"
    checked: "2026-10-22"

  - id: plan_ids_real
    fact: >-
      Valid planID values enumerated by the live API's own 400 validation
      message: ir-small, ir-medium, standard-base, standard-plus, pro, pro-plus,
      pro-max, small-g2, medium-g2, standard-base-g2, standard-plus-g2, pro-g2,
      pro-plus-g2, pro-max-g2, express-g2 — smallest is ir-small
    status: VERIFIED
    source: "real HTTP call POST /v1/projects with invalid planID -> 400 listing, 2026-10-22"
    checked: "2026-10-22"

  - id: create_app_402_zero_balance
    fact: >-
      POST /v1/projects on a zero-balance account returns 402
      {"message":"Not enough balance."}; downstream steps fail with
      project_not_found until credit exists
    status: VERIFIED
    source: "real HTTP call 402, 2026-10-22"
    checked: "2026-10-22"
  - id: boxapi_endpoint_reachable
    fact: >-
      https://ai.boxapi.ir/ai/v1 answers /models and /chat/completions with 401
      and OpenAI-shaped error JSON (type: proxy_error) without a key — endpoint
      exists, reachable, OpenAI-compatible surface confirmed
    status: VERIFIED
    source: "real HTTP probe 401 (no key held in sandbox), 2026-10-22"
    checked: "2026-10-22"
  - id: liara_http_api
    fact: >-
      Documented OpenAPI HTTP API exists (base https://api.liara.ir, auth
      "Authorization: Bearer $TOKEN", API keys from console menu "API").
      Relevant endpoints: POST /v2/projects/{name}/sources (deploy source code),
      GET /v1/projects/{name}/logs (app logs), POST /v1/projects/update-envs,
      apps create/delete/restart/turn-on-off, disks create/resize, plus
      wss://api.liara.ir?token=...&cmd=/bin/bash&project_id=... real-time shell.
    source: "https://developers.liara.ir/llms.txt"
    checked: "2026-10-20"
  - id: paas_api_auth
    fact: >-
      PaaS OpenAPI spec (openapi 3.0.1) root security accepts jwt (apiKey named
      Authorization in header) OR bearerAuth (http bearer, JWT format). We send
      "Authorization: Bearer <token>". Base server: https://api.liara.ir
    source: "https://developers.liara.ir/spec/paas.yaml"
    checked: "2026-10-20"
  - id: paas_api_endpoints
    fact: >-
      Exact request/response shapes from the spec —
      POST /v1/projects  body {name, planID, platform, readOnlyRootFilesystem?, network?}
        -> 200|400|401|409 (createApp; body schema declares NO required fields;
        name/planID/platform are needed in practice).
      GET /v1/projects/{name} -> {project: {project_id, type, status,
        defaultSubdomain(bool), envs:[{key,value,encrypted}], planID, ...}} (getAppByName).
      POST /v2/projects/{name}/sources  multipart/form-data, required field "file"
        (binary) -> 200 {sourceID} (sourcesDeploy).
      POST /v1/projects/update-envs  body {project, variables:[{key,value}]}
        -> 200 {message} (updateEnvs).
      POST /v1/projects/{name}/disks  body {name: string, size: string} -> 201
        (createDisk; size is a STRING).
      GET /v1/projects/{id}/disks -> {disks:[{_id,name,size,updatedAt,createdAt}],
        mounts:[{name, mountedTo}]} (getDisks).
      GET /v1/projects/{name}/logs?since=... -> array of {type, datetime, message}
        (getAppLogs).
    source: "https://developers.liara.ir/spec/paas.yaml"
    checked: "2026-10-20"
  - id: paas_api_error_codes
    fact: >-
      Declared error responses per endpoint are 400/401/404 (+409 on createApp);
      429 and 5xx are NOT declared. Retry-with-backoff on 429/5xx/timeout is
      LiaraPilot's own policy, not documented API behavior.
    source: "https://developers.liara.ir/spec/paas.yaml"
    checked: "2026-10-20"
  - id: metrics_endpoints
    fact: >-
      Resource metrics EXIST in the spec (tag Reports): GET
      /v1/projects/{name}/metrics/summary (no params) -> {cpuUsage:[{value,
      applet}], memoryUsage:[...], disksUsage:[{size, usage, reportedAt, name}]};
      GET /v1/projects/{name}/metrics/cpu | memory | network-receive |
      network-transmit with REQUIRED query param since (type number) ->
      Reports {end, result:[{values, applet}]}. Errors 400/401/404.
      Real response VALUES/units not yet observed — labelled UNVERIFIED in UI
      until a live read succeeds.
    source: "config/spec/paas.yaml (snapshot of developers.liara.ir/spec/paas.yaml)"
    checked: "2026-10-20"
  - id: restart_endpoint
    fact: >-
      POST /v1/projects/{name}/actions/restart -> 200 "request submitted" | 401 | 404
    source: "config/spec/paas.yaml (line ~183)"
    checked: "2026-10-20"
  - id: resize_plan_endpoint
    fact: >-
      POST /v1/projects/{name}/resize body {planID} (required) -> 200|400|401|404
      (changePlan). Plan catalog/list endpoint DOES NOT exist in the spec —
      planID values and prices cannot be read live from this API.
    source: "config/spec/paas.yaml (line ~472); grep evidence in docs/METRICS_VERIFICATION.md"
    checked: "2026-10-20"
  - id: scale_onoff_endpoint
    fact: >-
      POST /v1/projects/{name}/actions/scale body {scale: number}; description:
      "Return 1 to turn on or 0 to turn off" -> 200|401|404 (turnApp)
    source: "config/spec/paas.yaml (line ~146)"
    checked: "2026-10-20"
  - id: apps_list_endpoint
    fact: >-
      GET /v1/projects -> Projects schema (all apps owned by the token) | 401 | 404
    source: "config/spec/paas.yaml (line ~47)"
    checked: "2026-10-20"
  - id: destructive_endpoints
    fact: >-
      DELETE /v1/projects/{name} (deleteAppByName) and DELETE
      /v1/projects/{id}/disks/{name} EXIST — LiaraPilot never calls them; they
      map to risk tier 3 (forbidden / manual-only) in docs/ARCHITECTURE.md
    source: "config/spec/paas.yaml (paths at ~93 and ~861)"
    checked: "2026-10-20"
  - id: logs_since_required
    fact: >-
      GET /v1/projects/{name}/logs REQUIRES query param since (type string,
      description "Show logs since timestamp"); value format still UNVERIFIED —
      LIARA_LOGS_SINCE env (default "0"), adjust if the live API rejects it
    source: "config/spec/paas.yaml (line ~957)"
    checked: "2026-10-20"

