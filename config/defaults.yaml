limits:
  max_upload_mb: 25
  max_files: 4000
  max_total_extract_mb: 120
  fix_attempts_max: 3
llm:
  max_tokens_per_run: 60000
  request_timeout_s: 30
monitor:
  interval_s: 30
  history_n: 30
  alert_after: 2
  max_lifetime_samples: 600
deploy:
  timeout_s: 300
  verify_timeout_s: 10
  verify_path: /
  http_timeout_s: 30
  poll_interval_s: 5
  max_retries: 3
  platform_values:
  - node
  - next
  - laravel
  - php
  - python
  - django
  - flask
  - dotnet
  - react
  - angular
  - vue
  - static
  - docker
  source_zip_exclude:
  - node_modules
  - .next
  - .git
  - __pycache__
  - .turbo
  - .cache
  - coverage
  - .vercel
  - .env
  - .DS_Store
  - '*.pyc'
  - '*.pyo'
  - '*.log'
  - '*.sqlite'
  - '*.db'
security:
  vendor_sdk_packages:
  - z-ai-web-dev-sdk
  secret_key_patterns:
  - password
  - passwd
  - secret
  - token
  - api_key
  - apikey
  - admin_password
  placeholder_value_prefixes:
  - changeme
  - change-me
  - your-
  - example
  - xxx
  - todo
  - insert-
  - <
  - ${
  - rep
  secret_min_value_len: 6
demo:
  mock_failures:
  - bad_port
  - missing_env_var
  mock_port: 8080
  mock_env_var: DATABASE_URL
verified_facts:
- id: billing_endpoint_real
  fact: GET /v1/billing (documented outside paas.yaml) returns 200 with {user:{balance,accountType,minCreditAmount,isManualMinCredit}};
    live account shows balance 0 — this is why app creation returns 402
  status: VERIFIED
  source: real HTTP call 200, 2026-10-22
  checked: '2026-10-22'
- id: plan_ids_real
  fact: 'Valid planID values enumerated by the live API''s own 400 validation message: ir-small, ir-medium,
    standard-base, standard-plus, pro, pro-plus, pro-max, small-g2, medium-g2, standard-base-g2, standard-plus-g2,
    pro-g2, pro-plus-g2, pro-max-g2, express-g2 — smallest is ir-small'
  status: VERIFIED
  source: real HTTP call POST /v1/projects with invalid planID -> 400 listing, 2026-10-22
  checked: '2026-10-22'
- id: ir_small_rejected_g1_plan_unavailable
  fact: 'POST /v1/projects with planID=ir-small (node platform, bundle=basic) returns 400
    {"message":"g1_plan_unavailable"} even though ir-small appears in the API''s own validation
    list — the g1 family is not provisionable for this account/platform combo. VERIFIED WORKING
    plan for node apps: small-g2 (~660 Toman/h) — real create+build+deploy+verify 2026-10-23'
  status: VERIFIED
  source: 'real HTTP 400 on create (live session event i=17) + real 200 create+deploy with
    planID=small-g2 (live session, url 200 from outside), 2026-10-23'
  checked: '2026-10-23'
- id: create_app_402_zero_balance
  fact: POST /v1/projects on a zero-balance account returns 402 {"message":"Not enough balance."}; downstream
    steps fail with project_not_found until credit exists
  status: VERIFIED
  source: real HTTP call 402, 2026-10-22
  checked: '2026-10-22'
- id: boxapi_endpoint_reachable
  fact: 'https://ai.boxapi.ir/ai/v1 answers /models and /chat/completions with 401 and OpenAI-shaped error
    JSON (type: proxy_error) without a key — endpoint exists, reachable, OpenAI-compatible surface confirmed'
  status: VERIFIED
  source: real HTTP probe 401 (no key held in sandbox), 2026-10-22
  checked: '2026-10-22'
- id: liara_http_api
  fact: 'Documented OpenAPI HTTP API exists (base https://api.liara.ir, auth "Authorization: Bearer $TOKEN",
    API keys from console menu "API"). Relevant endpoints: POST /v2/projects/{name}/sources (deploy source
    code), GET /v1/projects/{name}/logs (app logs), POST /v1/projects/update-envs, apps create/delete/restart/turn-on-off,
    disks create/resize, plus wss://api.liara.ir?token=...&cmd=/bin/bash&project_id=... real-time shell.'
  source: https://developers.liara.ir/llms.txt
  checked: '2026-10-20'
- id: paas_api_auth
  fact: 'PaaS OpenAPI spec (openapi 3.0.1) root security accepts jwt (apiKey named Authorization in header)
    OR bearerAuth (http bearer, JWT format). We send "Authorization: Bearer <token>". Base server: https://api.liara.ir'
  source: https://developers.liara.ir/spec/paas.yaml
  checked: '2026-10-20'
- id: paas_api_endpoints
  fact: "Exact request/response shapes from the spec — POST /v1/projects  body {name, planID, platform,\
    \ readOnlyRootFilesystem?, network?}\n  -> 200|400|401|409 (createApp; body schema declares NO required\
    \ fields;\n  name/planID/platform are needed in practice).\nGET /v1/projects/{name} -> {project: {project_id,\
    \ type, status,\n  defaultSubdomain(bool), envs:[{key,value,encrypted}], planID, ...}} (getAppByName).\n\
    POST /v2/projects/{name}/sources  multipart/form-data, required field \"file\"\n  (binary) -> 200\
    \ {sourceID} (sourcesDeploy).\nPOST /v1/projects/update-envs  body {project, variables:[{key,value}]}\n\
    \  -> 200 {message} (updateEnvs).\nPOST /v1/projects/{name}/disks  body {name: string, size: string}\
    \ -> 201\n  (createDisk; size is a STRING).\nGET /v1/projects/{id}/disks -> {disks:[{_id,name,size,updatedAt,createdAt}],\n\
    \  mounts:[{name, mountedTo}]} (getDisks).\nGET /v1/projects/{name}/logs?since=... -> array of {type,\
    \ datetime, message}\n  (getAppLogs)."
  source: https://developers.liara.ir/spec/paas.yaml
  checked: '2026-10-20'
- id: paas_api_error_codes
  fact: Declared error responses per endpoint are 400/401/404 (+409 on createApp); 429 and 5xx are NOT
    declared. Retry-with-backoff on 429/5xx/timeout is LiaraPilot's own policy, not documented API behavior.
  source: https://developers.liara.ir/spec/paas.yaml
  checked: '2026-10-20'
- id: metrics_endpoints
  fact: 'Resource metrics EXIST in the spec (tag Reports): GET /v1/projects/{name}/metrics/summary (no
    params) -> {cpuUsage:[{value, applet}], memoryUsage:[...], disksUsage:[{size, usage, reportedAt, name}]};
    GET /v1/projects/{name}/metrics/cpu | memory | network-receive | network-transmit with REQUIRED query
    param since (type number) -> Reports {end, result:[{values, applet}]}. Errors 400/401/404. Real response
    VALUES/units not yet observed — labelled UNVERIFIED in UI until a live read succeeds.'
  source: config/spec/paas.yaml (snapshot of developers.liara.ir/spec/paas.yaml)
  checked: '2026-10-20'
- id: restart_endpoint
  fact: POST /v1/projects/{name}/actions/restart -> 200 "request submitted" | 401 | 404
  source: config/spec/paas.yaml (line ~183)
  checked: '2026-10-20'
- id: resize_plan_endpoint
  fact: POST /v1/projects/{name}/resize body {planID} (required) -> 200|400|401|404 (changePlan). Plan
    catalog/list endpoint DOES NOT exist in the spec — planID values and prices cannot be read live from
    this API.
  source: config/spec/paas.yaml (line ~472); grep evidence in docs/METRICS_VERIFICATION.md
  checked: '2026-10-20'
- id: scale_onoff_endpoint
  fact: 'POST /v1/projects/{name}/actions/scale body {scale: number}; description: "Return 1 to turn on
    or 0 to turn off" -> 200|401|404 (turnApp)'
  source: config/spec/paas.yaml (line ~146)
  checked: '2026-10-20'
- id: apps_list_endpoint
  fact: GET /v1/projects -> Projects schema (all apps owned by the token) | 401 | 404
  source: config/spec/paas.yaml (line ~47)
  checked: '2026-10-20'
- id: destructive_endpoints
  fact: DELETE /v1/projects/{name} (deleteAppByName) and DELETE /v1/projects/{id}/disks/{name} EXIST —
    LiaraPilot never calls them; they map to risk tier 3 (forbidden / manual-only) in docs/ARCHITECTURE.md
  source: config/spec/paas.yaml (paths at ~93 and ~861)
  checked: '2026-10-20'
- id: logs_since_required
  fact: GET /v1/projects/{name}/logs REQUIRES query param since (type string, description "Show logs since
    timestamp"); value format still UNVERIFIED — LIARA_LOGS_SINCE env (default "0"), adjust if the live
    API rejects it
  source: config/spec/paas.yaml (line ~957)
  checked: '2026-10-20'
- id: plan_id_values
  fact: 'Real planIDs come from the live catalog GET /v1/me (see plans_catalog_at_v1_me: small-g2, ir-small,
    medium-g2, standard-*-g2, pro-*-g2, express-g2). The deployer still REQUIRES an explicit LIARA_PLAN_ID
    for app creation so no credit is spent by accident'
  status: VERIFIED
  source: real HTTP call GET /v1/me?teamID=... -> 200 catalog, 2026-10-22
  checked: '2026-10-22'
- id: disk_size_units
  fact: 'createDisk "size" must be a NUMBER of GB — "1G" returns 400 {"message":"size must be a number"};
    size 1 returns 201 and the app reports reservedDiskSpace: 1. Default LIARA_DISK_SIZE=1'
  status: VERIFIED
  source: real calls 2026-10-22 (400 on string, 201 on number, reservedDiskSpace=1)
  checked: '2026-10-22'
- id: release_api_flow
  fact: Deploying = sources upload (-> sourceID) THEN POST /v2/projects/{name}/releases {sourceID, port,
    type, message non-empty, build{cache}, cron[], args[], disks[], envs{}, platformConfig{}} -> {releaseID};
    observe GET /v2/releases/{id}/build-logs ?since=<last createdAt> -> release.state READY|FAILED|UNHEALTHY|TIMEDOUT|CANCELED
    + real build output lines. UNHEALTHY = built but not serving
  source: real calls 2026-10-22 (releases 6ada77b6 READY, 6ada7da2 FAILED-silent, 6ada7ea5 READY-502)
    + liara-cloud/cli deploy.ts + build-logs.ts
  checked: '2026-10-22'
  status: VERIFIED
- id: sources_artifact_tar_gz
  fact: The sources payload is a gzip tar (multipart field 'file', content-type application/gzip, name
    *.tar.gz) — a zip or a tar sent as application/zip is stored as *.zip and the builder fails extraction
    every time
  source: 'real builds 2026-10-22: zip -> FAILED extraction x2; tar as application/zip -> FAILED; tar
    as application/gzip -> READY; CLI create-archive.ts (tar, gzip 9)'
  checked: '2026-10-22'
  status: VERIFIED
- id: update_envs_returns_201
  fact: POST /v1/projects/update-envs answers 201 {"message":"success"} — accepting only 200 silently
    failed every real deploy until fixed
  source: real call 2026-10-22 (live 201; manual replays 201, HTTP status captured)
  checked: '2026-10-22'
  status: VERIFIED
- id: docker_builder_no_pypi
  fact: 'The iran-region docker builder cannot reach PyPI or public mirrors from RUN steps (3 silent FAILED
    releases: direct, runflare mirror, offline wheels at COPY); buildpacks instead use an internal mirror
    10.16.100.42/repository/pypi-proxy. Deploying the agent itself (A4) via platform docker is therefore
    blocked; python buildpack reaches READY but its container-start convention for a raw FastAPI Procfile
    app stays UNVERIFIED (502, runtime logs not exposed via GET /v1/projects/{name}/logs)'
  source: real releases 2026-10-22 (6ada7b1e, 6ada7bc9, 6ada7ccdf, 6ada7da2 FAILED; 6ada7ea5 READY->502)
  checked: '2026-10-22'
  status: VERIFIED
- id: live_url_format
  fact: 'Deployed app URL: https://{app}.liara.run for apps WITH a network; iran-region apps WITHOUT a
    network use https://{app}.iran.liara.run (CLI deploy.ts). Proven live: 200 from https://liarapilot-app.liara.run
    after the self-fix'
  source: real HTTP 200 2026-10-22 + liara-cloud/cli deploy.ts subdomain logic
  checked: '2026-10-22'
  status: VERIFIED
