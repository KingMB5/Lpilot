# LiaraPilot deterministic configuration.
# Rule (AGENTS.md): never invent prices, limits or API behavior.
# VERIFIED facts carry source URL + checked date. Everything else stays UNVERIFIED.

limits:
  max_upload_mb: 25
  max_files: 4000            # max entries in an uploaded zip
  max_total_extract_mb: 120  # uncompressed size cap
  fix_attempts_max: 3        # agent self-fix loop cap (enforced in code)

llm:
  max_tokens_per_run: 60000  # approximate per-run budget, enforced in code (T11)
  request_timeout_s: 30

deploy:
  timeout_s: 600
  verify_timeout_s: 10
  verify_path: "/"
  http_timeout_s: 30          # per-request timeout for the PaaS API
  poll_interval_s: 5          # app-status polling while a deploy builds
  max_retries: 3              # our policy for 429/5xx/timeout (NOT documented API behavior)
  platform_values:            # VERIFIED: config fact liara_json_platform_values
    [node, next, laravel, php, python, django, flask, dotnet, react, angular, vue, static, docker]
  source_zip_exclude:         # never travel inside the uploaded artifact (.env = secrets)
    [node_modules, .next, .git, __pycache__, .turbo, .cache, coverage, .vercel,
     .env, .DS_Store, "*.pyc", "*.pyo", "*.log", "*.sqlite", "*.db"]

security:
  # SDKs known/expected to depend on their original vendor environment.
  vendor_sdk_packages:
    - z-ai-web-dev-sdk
  secret_key_patterns:
    - password
    - passwd
    - secret
    - token
    - api_key
    - apikey
    - admin_password
  # Values that look like placeholders and are NOT flagged as hardcoded secrets.
  placeholder_value_prefixes: ["changeme", "change-me", "your-", "example", "xxx", "todo", "insert-", "<", "${", "rep"]
  secret_min_value_len: 6

demo:
  # DEMO_MODE=1 (env) forces FakeLLM + MockDeployer regardless of other settings.
  mock_failures: [bad_port, missing_env_var]   # canned MockDeployer failure sequence
  mock_port: 8080
  mock_env_var: DATABASE_URL

verified_facts:
  - id: cli_deploy_flags
    fact: >-
      liara deploy accepts --api-token, --path, --platform, -a/--app, -p/--port,
      --detach, --no-app-logs, --build-arg, --no-cache, -b iran|germany,
      --team-id, --liara-json
    source: "https://docs.liara.ir/references/cli/deploy-app/"
    checked: "2026-10-20"
  - id: node_sqlite_needs_disk
    fact: >-
      SQLite on Liara Node.js apps requires creating a disk and mounting it via
      liara.json; official example uses the raw sqlite3 module, not Prisma
    source: "https://docs.liara.ir/paas/nodejs/how-tos/connect-to-db/sqlite/"
    checked: "2026-10-20"
  - id: prisma_guide_is_postgres
    fact: "Official Liara Prisma guide uses PostgreSQL only"
    source: "https://docs.liara.ir/paas/nodejs/how-tos/connect-to-db/prisma/"
    checked: "2026-10-20"
  - id: no_official_nextjs_guide
    fact: >-
      No official Next.js guide listed under Liara Node platform docs
      (Nuxt, Remix, Nitro, NestJS guides exist)
    source: "https://docs.liara.ir/paas/nodejs/getting-started/"
    checked: "2026-10-20"
  - id: liara_json_platform_values
    fact: >-
      liara.json "platform" accepts exactly: node, next, laravel, php, python,
      django, flask, dotnet, react, angular, vue, static, docker ("next" IS official);
      wrong value aborts deploy. "port" field also supported.
    source: "https://docs.liara.ir/paas/liarajson/"
    checked: "2026-10-20"
  - id: liara_json_disks_schema
    fact: 'liara.json disks schema: {"disks":[{"name":"database","mountTo":"db"}]}'
    source: "https://docs.liara.ir/paas/nodejs/how-tos/connect-to-db/sqlite/"
    checked: "2026-10-20"
  - id: liara_http_api
    fact: >-
      Documented OpenAPI HTTP API exists (base https://api.liara.ir, auth
      "Authorization: Bearer $TOKEN", API keys from console menu "API").
      Relevant endpoints: POST /v2/projects/{name}/sources (deploy source code),
      GET /v1/projects/{name}/logs (app logs), POST /v1/projects/update-envs,
      apps create/delete/restart/turn-on-off, disks create/resize, plus
      wss://api.liara.ir?token=...&cmd=/bin/bash&project_id=... real-time shell.
    source: "https://developers.liara.ir/llms.txt"
    checked: "2026-10-20"
  - id: deployer_recommendation
    fact: >-
      Pure-Python LiaraApiDeployer via the HTTP API is viable and preferred
      (no Node runtime needed); LiaraCliDeployer stays as fallback. Deploy-sources
      payload/auth details must be re-checked against the OpenAPI spec (paas.yaml)
      before Thursday implementation.
    source: "https://developers.liara.ir/pass/deploy/deploy-sources-code.md"
    checked: "2026-10-20"
  - id: paas_api_auth
    fact: >-
      PaaS OpenAPI spec (openapi 3.0.1) root security accepts jwt (apiKey named
      Authorization in header) OR bearerAuth (http bearer, JWT format). We send
      "Authorization: Bearer <token>". Base server: https://api.liara.ir
    source: "https://developers.liara.ir/spec/paas.yaml"
    checked: "2026-10-20"
  - id: paas_api_endpoints
    fact: >-
      Exact request/response shapes from the spec —
      POST /v1/projects  body {name, planID, platform, readOnlyRootFilesystem?, network?}
        -> 200|400|401|409 (createApp; body schema declares NO required fields;
        name/planID/platform are needed in practice).
      GET /v1/projects/{name} -> {project: {project_id, type, status,
        defaultSubdomain(bool), envs:[{key,value,encrypted}], planID, ...}} (getAppByName).
      POST /v2/projects/{name}/sources  multipart/form-data, required field "file"
        (binary) -> 200 {sourceID} (sourcesDeploy).
      POST /v1/projects/update-envs  body {project, variables:[{key,value}]}
        -> 200 {message} (updateEnvs).
      POST /v1/projects/{name}/disks  body {name: string, size: string} -> 201
        (createDisk; size is a STRING).
      GET /v1/projects/{id}/disks -> {disks:[{_id,name,size,updatedAt,createdAt}],
        mounts:[{name, mountedTo}]} (getDisks).
      GET /v1/projects/{name}/logs?since=... -> array of {type, datetime, message}
        (getAppLogs).
    source: "https://developers.liara.ir/spec/paas.yaml"
    checked: "2026-10-20"
  - id: paas_api_error_codes
    fact: >-
      Declared error responses per endpoint are 400/401/404 (+409 on createApp);
      429 and 5xx are NOT declared. Retry-with-backoff on 429/5xx/timeout is
      LiaraPilot's own policy, not documented API behavior.
    source: "https://developers.liara.ir/spec/paas.yaml"
    checked: "2026-10-20"

unverified_facts:
  - id: pricing
    fact: "All Liara plan/disk/egress prices"
    status: UNVERIFIED
  - id: plan_id_values
    fact: >-
      Plan catalog IDs usable as createApp planID (e.g. g1/g2/h1...) are NOT in
      the spec; LIARA_PLAN_ID env must be provided by the operator (console shows it)
    status: UNVERIFIED
  - id: disk_size_units
    fact: >-
      createDisk "size" is declared string but units (e.g. "1G" vs bytes) are not
      specified; default from LIARA_DISK_SIZE env
    status: UNVERIFIED
  - id: app_status_strings
    fact: >-
      Possible values of project.status (polling matcher uses best-effort sets
      running/ok/ready/... vs failed/error/...); to be confirmed on Thursday
    status: UNVERIFIED
  - id: default_subdomain_url
    fact: >-
      Live URL format assumed https://{app-name}.liara.run; not found in spec or
      static docs pages (SPA). Verify Thursday from a real deploy/getAppByName
    status: UNVERIFIED
  - id: sources_deploy_semantics
    fact: >-
      Whether POST /v2/projects/{name}/sources triggers build+release and honors
      liara.json (platform/port/disks) inside the uploaded zip (CLI presumably
      does this); no explicit statement in spec
    status: UNVERIFIED
  - id: disk_mount_mechanism
    fact: >-
      API has no "attach disk" endpoint; mounting is assumed to happen at deploy
      time from liara.json disks:[{name, mountTo}] (matches docs.liara.ir SQLite guide)
    status: UNVERIFIED
  - id: logs_since_format
    fact: "Format of getAppLogs `since` query param (timestamp/date string)"
    status: UNVERIFIED
  - id: deploy_sources_payload
    fact: >-
      Superseded by paas_api_endpoints (multipart field "file" verified); build
      log streaming during upload still unobserved
    status: UNVERIFIED
  - id: python_platform_build_run
    fact: >-
      How Liara's Python buildpack detects build/run commands for the agent's own
      deploy (requirements.txt / Procfile / liara.json fields) — not in paas.yaml
      or verified docs; agent ships liara.json {platform: python, port: 3000} +
      requirements.txt + uvicorn run command
    status: UNVERIFIED
  - id: liara_json_healthcheck_field
    fact: >-
      Whether liara.json supports a healthCheck declaration and its schema;
      agent exposes GET /api/health regardless
    status: UNVERIFIED
  - id: port_env_var
    fact: "Whether Liara injects a PORT env var that the app must bind at runtime"
    status: UNVERIFIED
  - id: prisma_sqlite_on_liara
    fact: "Whether Prisma+SQLite works reliably on a mounted disk on Liara"
    status: UNVERIFIED
  - id: cli_exit_codes
    fact: "liara deploy exit codes and machine-readable output for failure parsing"
    status: UNVERIFIED
  - id: cli_log_access
    fact: >-
      CLI log access: superseded by verified HTTP API GET /v1/projects/{name}/logs;
      CLI flag still unverified
    status: UNVERIFIED
